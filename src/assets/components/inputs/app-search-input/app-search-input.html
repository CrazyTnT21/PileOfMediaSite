<span id="outline" class="input parent container" part="outline">
  <label for="input" part="label">
  <slot id="label-slot"></slot>
  </label>
  <input id="input" class="control" part="inner-input">
  <app-button aria-label="Search" exportparts="button: icon-button" tabindex="-1">
    <slot name="icon-button">
      <span id="icon" class="icon" part="icon"></span>
    </slot>
  </app-button>
</span>
